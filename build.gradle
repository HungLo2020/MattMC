// Task to create a runnable client distribution using classpath (more reliable than fat JAR)
tasks.register('clientDist') {
    group = 'distribution'
    description = 'Creates a runnable client distribution with ONE JAR'
    
    // Simple dependencies - just build the single JAR
    dependsOn 'jar', 'downloadJdk', 'shaderPackZip', 'buildRustNative'
    
    def distDir = "${buildDir}/client-dist/MattMC"
    
    outputs.dir distDir
    
    doLast {
        // Create directory structure for client
        file("${distDir}/lib").mkdirs()
        file("${distDir}/natives").mkdirs()
        file("${distDir}/run").mkdirs()
        file("${distDir}/run/resourcepacks").mkdirs()
        file("${distDir}/run/shaderpacks").mkdirs()
        // Note: No run/mods directory needed - everything in ONE JAR!
        // Note: No run/assets directory needed - assets loaded from JAR!
        
        // Create directory structure for server
        file("${distDir}/server").mkdirs()
        file("${distDir}/server/run").mkdirs()
        
        // Copy the ONE JAR containing everything
        copy {
            from jar.archiveFile.get().asFile
            into "${distDir}/lib"
        }
        println "Copied unified JAR to ${distDir}/lib"
        
        // Copy all dependency JARs
        copy {
            from configurations.runtimeClasspath
            into "${distDir}/lib"
        }
        
        // All resources (assets, data, shaders, etc.) are already in the JAR
        // No need to copy them separately to the distribution
        copy {
            from rustBuiltNativesDir
            into "${distDir}/natives"
            include '*.so'
            include '*.dll'
            include '*.dylib'
        }
        println "Copied Rust native libraries to ${distDir}/natives"
        
        // Copy bundled JDK(s) to distribution using platform-labeled paths
        def copiedPlatformJdks = []
        def multiPlatformRoot = file("libraries/jdk")
        if (multiPlatformRoot.exists() && multiPlatformRoot.isDirectory()) {
            multiPlatformRoot.eachDir { platformDir ->
                def isWindowsPlatform = platformDir.name.startsWith('win-')
                def javaExe = isWindowsPlatform ?
                    new File(platformDir, 'bin/java.exe') :
                    new File(platformDir, 'bin/java')
                if (javaExe.exists()) {
                    copy {
                        from platformDir
                        into "${distDir}/run/jdk/${platformDir.name}"
                    }
                    copiedPlatformJdks << platformDir.name
                }
            }
        }

        if (!copiedPlatformJdks.isEmpty()) {
            println "✅ JDK copied to distribution for platform(s): ${copiedPlatformJdks.join(', ')}"
        }

        // Assets are now loaded directly from the JAR - no filesystem copy needed!
        // This eliminates 407MB of duplication
        
        // Copy shader pack zip to shaderpacks directory
        copy {
            from file("${buildDir}/shaderpacks")
            into "${distDir}/run/shaderpacks"
            include '*.zip'
        }
        println "Copied shader pack to ${distDir}/run/shaderpacks"
        
        // Copy and process launch scripts from packaging directory
        // Process each script file in the packaging directory
        def packagingDir = file('packaging')
        packagingDir.eachFile { scriptFile ->
            // Only process regular files, skip directories
            if (scriptFile.isDirectory()) {
                return
            }
            
            if (scriptFile.name.endsWith('.sh')) {
                // Linux script - process template placeholders
                def linuxScriptTemplate = scriptFile.text
                
                // Determine if this is a client or server script
                if (scriptFile.name.startsWith('run-server')) {
                    // Server script - place in server directory
                    def linuxScript = file("${distDir}/server/${scriptFile.name}")
                    linuxScript.text = linuxScriptTemplate
                        .replace('@VERSION@', version)
                    linuxScript.setExecutable(true)
                } else {
                    // Client script - place in root directory
                    def linuxScript = file("${distDir}/${scriptFile.name}")
                    linuxScript.text = linuxScriptTemplate
                        .replace('@VERSION@', version)
                    linuxScript.setExecutable(true)
                }
            } else if (scriptFile.name.endsWith('.bat')) {
                // Windows script - process template placeholders
                def windowsScriptTemplate = scriptFile.text
                
                // Determine if this is a client or server script
                if (scriptFile.name.startsWith('run-server')) {
                    // Server script - place in server directory
                    def windowsScript = file("${distDir}/server/${scriptFile.name}")
                    windowsScript.text = windowsScriptTemplate
                        .replace('@VERSION@', version)
                } else {
                    // Client script - place in root directory
                    def windowsScript = file("${distDir}/${scriptFile.name}")
                    windowsScript.text = windowsScriptTemplate
                        .replace('@VERSION@', version)
                }
            } else if (scriptFile.name.endsWith('.ps1')) {
                // PowerShell script - process template placeholders
                def powershellScriptTemplate = scriptFile.text
                def powershellScript = file("${distDir}/${scriptFile.name}")
                powershellScript.text = powershellScriptTemplate
                    .replace('@VERSION@', version)
            } else {
                // Copy any other files as-is (e.g., README, documentation)
                // Special handling for SERVER-README.md
                if (scriptFile.name == 'SERVER-README.md') {
                    copy {
                        from scriptFile
                        into "${distDir}/server"
                        rename { 'README.md' }
                    }
                } else {
                    copy {
                        from scriptFile
                        into distDir
                    }
                }
            }
        }
        
        println "✅ Server files created in ${distDir}/server"
    }
}

// Task to create a zip of the client distribution
tasks.register('clientDistZip', Zip) {
    group = 'distribution'
    description = 'Creates a zip of the runnable client distribution'
    
    dependsOn 'clientDist'
    
    def platformKey = resolveCurrentPlatformKey()
    if (platformKey == null) {
        throw new GradleException("Unsupported platform for client distribution zip: ${System.getProperty('os.name')} ${System.getProperty('os.arch')}")
    }

    def releasePlatformKey = platformKey.startsWith('win-') ? platformKey.replaceFirst('win-', 'windows-') : platformKey
    archiveFileName = "MattMC-Client-${version}-${releasePlatformKey}.zip"
    
    from "${buildDir}/client-dist"
    
    destinationDirectory = file("${buildDir}/distributions")
}

// ===== TESTING CONFIGURATION =====

// Configure JUnit 5 test platform for standard tests
test {
    useJUnitPlatform()
    
    // Configure test output
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
        showCauses = true
        showStackTraces = true
        
        // Show summary after test execution
        afterSuite { desc, result ->
            if (!desc.parent) {
                println "\nTest Results: ${result.resultType}"
                println "Tests run: ${result.testCount}, " +
                        "Passed: ${result.successfulTestCount}, " +
                        "Failed: ${result.failedTestCount}, " +
                        "Skipped: ${result.skippedTestCount}"
            }
        }
    }
    
    // Set max heap for tests
    maxHeapSize = "2g"
    
    // Exclude performance tests from regular test runs
    // Performance tests are identified by naming convention: *PerformanceTest or *Benchmark
    exclude '**/*PerformanceTest.class'
    exclude '**/*Benchmark.class'
}

// Separate task for performance tests
tasks.register('performanceTest', Test) {
    group = 'verification'
    description = 'Runs performance tests and benchmarks (tests ending with "PerformanceTest" or "Benchmark")'
    
    // Use the test source set (same as regular test task)
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    
    useJUnitPlatform()
    
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true  // Show stdout for performance metrics
        
        // Show summary after test execution
        afterSuite { desc, result ->
            if (!desc.parent) {
                println "\nPerformance Test Results: ${result.resultType}"
                println "Tests run: ${result.testCount}, " +
                        "Passed: ${result.successfulTestCount}, " +
                        "Failed: ${result.failedTestCount}, " +
                        "Skipped: ${result.skippedTestCount}"
            }
        }
    }
    
    // Include performance tests by naming convention
    // Tests ending with "PerformanceTest" or "Benchmark" are considered performance tests
    include '**/*PerformanceTest.class'
    include '**/*Benchmark.class'
    
    // More memory for performance tests
    maxHeapSize = "4g"
    outputs.upToDateWhen { false }  // Always run performance tests to get fresh results
}

// ===== ARCHITECTURAL BOUNDARY ENFORCEMENT =====
// Enforce architectural boundaries by running tests during compilation
// This ensures that architectural violations (e.g., direct OpenGL/Vulkan imports
// outside of backends/) will FAIL the build process, not just fail when tests are
// manually run. See src/main/java/net/vulkanic/README.md for architectural principles.
tasks.named('compileJava') {
    finalizedBy test
}

// Also enforce boundaries before launching the game client so `runClient`
// cannot execute with architectural violations.
tasks.named('runClient') {
    dependsOn test
}

// Task to run all tests (both misc and performance)
tasks.register('testAll', Test) {
    group = 'verification'
    description = 'Runs all tests including performance tests'
    
    // Use the test source set (same as regular test task)
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    
    useJUnitPlatform()
    
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
        
        // Show summary after test execution
        afterSuite { desc, result ->
            if (!desc.parent) {
                println "\nAll Tests Results: ${result.resultType}"
                println "Tests run: ${result.testCount}, " +
                        "Passed: ${result.successfulTestCount}, " +
                        "Failed: ${result.failedTestCount}, " +
                        "Skipped: ${result.skippedTestCount}"
            }
        }
    }
    
    maxHeapSize = "4g"
}

// Verify that production builds only use main source set (exclude tests)
// This ensures tests are never included in distributions
fatJar {
    // Explicitly use only main source set output
    from sourceSets.main.output
}

clientFatJar {
    // Explicitly use only main source set output
    from sourceSets.main.output
}

