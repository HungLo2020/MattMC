plugins {
    id 'java'
    id 'application'
}

group = 'net.minecraft'
version = '1.21.10'

// LWJGL version and natives configuration
def lwjglVersion = '3.3.3'
def lwjglNatives = System.getProperty('os.name').toLowerCase().contains('mac') 
    ? (System.getProperty('os.arch').contains('aarch64') || System.getProperty('os.arch').contains('arm64') ? 'natives-macos-arm64' : 'natives-macos')
    : System.getProperty('os.name').toLowerCase().contains('win') 
        ? (System.getProperty('os.arch').contains('64') ? 'natives-windows' : 'natives-windows-x86')
        : (System.getProperty('os.arch').contains('arm') || System.getProperty('os.arch').contains('aarch64')) 
            ? 'natives-linux-arm64' 
            : 'natives-linux'

// Read Java version from gradle.properties and make it available throughout the build script
ext.targetJavaVersion = project.hasProperty('java_version') ? Integer.parseInt(project.property('java_version').toString()) : 25

java {
    // Keep toolchain configuration for compilation
    // But we'll override at runtime for JavaExec tasks
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

// Check if bundled dependencies are available
def bundledDepsDir = file('libraries/deps')
def useBundledDeps = bundledDepsDir.exists() && bundledDepsDir.isDirectory()

if (useBundledDeps) {
    println "✓ Using bundled dependencies from libraries/deps/"
}

repositories {
    // Add bundled dependencies as a flat directory repository (offline mode)
    if (useBundledDeps) {
        flatDir {
            dirs bundledDepsDir
        }
    }
    
    // Maven Central (for most dependencies not in bundled set)
    mavenCentral()
    
    // Only add specialized remote repositories if bundled dependencies are NOT available
    if (!useBundledDeps) {
        println "⚠ Bundled dependencies not found. Using remote repositories."
        
        // Fabric Maven repository (for Fabric Loader dependencies)
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        
        // Minecraft libraries (primary source for Mojang dependencies)
        maven { 
            url = 'https://libraries.minecraft.net'
            content {
                includeGroup 'com.mojang'
                includeGroup 'net.minecraft'
            }
        }
        // JitPack for open-source Mojang libraries
        maven { 
            url = 'https://jitpack.io'
            content {
                includeGroup 'com.github.Mojang'
            }
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'com.mojang:brigadier:1.3.10'
        force 'com.mojang:datafixerupper:8.0.16'
        force 'org.ow2.asm:asm:9.9'
        force 'org.ow2.asm:asm-analysis:9.9'
        force 'org.ow2.asm:asm-commons:9.9'
        force 'org.ow2.asm:asm-tree:9.9'
        force 'org.ow2.asm:asm-util:9.9'
    }
}

// Exclude transitive ASM from dependencies ONLY when using bundled JARs
// When useBundledDeps=true: Prevents conflicts between bundled ASM 9.9 JARs and transitive ASM 9.3
// When useBundledDeps=false: ASM is provided via Maven dependencies and should NOT be excluded
if (useBundledDeps) {
    configurations.runtimeClasspath {
        exclude group: 'org.ow2.asm'
    }
}

// Minecraft 1.21.10 dependencies
dependencies {
    // Mojang libraries - use bundled JARs if available, otherwise use Maven coordinates
    if (useBundledDeps) {
        implementation files('libraries/deps/brigadier-1.3.10.jar')
        implementation files('libraries/deps/datafixerupper-8.0.16.jar')
        implementation files('libraries/deps/jtracy-1.0.29.jar')
    } else {
        implementation 'com.mojang:brigadier:1.3.10'
        implementation 'com.mojang:datafixerupper:8.0.16'
        implementation 'com.mojang:jtracy:1.0.29'
    }
    
    // Google libraries
    implementation 'com.google.guava:guava:32.1.2-jre'
    // Using Gson 2.11+ for Strictness enum
    implementation 'com.google.code.gson:gson:2.11.0'
    
    // Apache Commons
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'org.apache.commons:commons-compress:1.26.0'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpcore:4.4.16'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.22.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.22.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.22.1'
    
    // Netty
    implementation 'io.netty:netty-all:4.1.97.Final'
    
    // FastUtil
    implementation 'it.unimi.dsi:fastutil:8.5.12'
    
    // JNA (Java Native Access)
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    
    // JOML (Java OpenGL Math Library)
    implementation 'org.joml:joml:1.10.5'
    
    // JOptSimple (command line parsing)
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    
    // Microsoft MSAL4J for authentication
    implementation 'com.microsoft.azure:msal4j:1.14.3'
    
    // JetBrains annotations
    implementation 'org.jetbrains:annotations:24.1.0'
    
    // OSHI for system info
    implementation 'com.github.oshi:oshi-core:6.4.10'
    
    // ICU4J for Unicode support
    implementation 'com.ibm.icu:icu4j:74.2'
    
    // Java-ObjC-Bridge for macOS Objective-C interop
    implementation 'ca.weblite:java-objc-bridge:1.2'
    
    // JOrbis - Ogg Vorbis audio decoder
    implementation 'org.jcraft:jorbis:0.0.17'
    
    // ===== CLIENT DEPENDENCIES =====
    
    // LWJGL - Lightweight Java Game Library (OpenGL, GLFW, OpenAL, etc.)
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-vulkan'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-openal'
    implementation 'org.lwjgl:lwjgl-stb'
    implementation 'org.lwjgl:lwjgl-tinyfd'
    implementation 'org.lwjgl:lwjgl-freetype'
    implementation 'org.lwjgl:lwjgl-jemalloc'
    
    // LWJGL natives
    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-openal::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-tinyfd::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-freetype::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-jemalloc::${lwjglNatives}"
    
    // Note: @Environment and @EnvType annotations are now provided by custom implementation
    // in the net.minecraft.api package (replaced Fabric dependency)
    
    // ===== FABRIC LOADER DEPENDENCIES =====
    // Required for Fabric mod loading functionality
    // These are loaded from libraries/deps/ if available, otherwise from remote repositories
    
    if (useBundledDeps) {
        // Bundled Fabric Loader dependencies from libraries/deps/
        // ASM - bytecode manipulation (required by Fabric Loader)
        implementation files('libraries/deps/asm-9.9.jar')
        implementation files('libraries/deps/asm-analysis-9.9.jar')
        implementation files('libraries/deps/asm-commons-9.9.jar')
        implementation files('libraries/deps/asm-tree-9.9.jar')
        implementation files('libraries/deps/asm-util-9.9.jar')
        
        // Mapping IO - mapping file I/O
        implementation files('libraries/deps/mapping-io-0.7.1.jar')
        
        // Note: Fabric API stubs are in src/main/java/net/fabricmc/fabric/api/
        // No external Fabric API JARs needed - using Mojang-mapped stubs
    } else {
        // Remote Fabric Loader dependencies
        // ASM - bytecode manipulation (required by Fabric Loader)
        implementation 'org.ow2.asm:asm:9.9'
        implementation 'org.ow2.asm:asm-analysis:9.9'
        implementation 'org.ow2.asm:asm-commons:9.9'
        implementation 'org.ow2.asm:asm-tree:9.9'
        implementation 'org.ow2.asm:asm-util:9.9'
        
        // Mapping IO - mapping file I/O (requires Fabric Maven)
        implementation 'net.fabricmc:mapping-io:0.7.1'
    }
    
    // Fabric implementation dependencies (available on Maven Central)
    implementation 'org.ow2.sat4j:org.ow2.sat4j.core:2.3.6'
    implementation 'org.ow2.sat4j:org.ow2.sat4j.pb:2.3.6'
    
    // ===== IRIS DEPENDENCIES =====
    // JCPP - C preprocessor for shader parsing
    implementation 'org.anarres:jcpp:1.4.14'
    // ANTLR - Parser generator for shader language
    implementation 'org.antlr:antlr4-runtime:4.13.1'
    // GLSL Transformer - GLSL shader transformation library
    implementation 'io.github.douira:glsl-transformer:3.0.0-pre3'
    
    // ===== DISTANT HORIZONS DEPENDENCIES =====
    // Additional dependencies required for Distant Horizons core
    // LWJGL JAWT for embedded GUI frames (no natives needed - pure Java bridge)
    implementation 'org.lwjgl:lwjgl-jawt:3.3.3'
    
    // Compression libraries
    implementation 'com.github.luben:zstd-jni:1.5.7-6'
    implementation 'org.lz4:lz4-java:1.8.0'
    implementation 'org.tukaani:xz:1.9'
    
    // Database
    implementation 'org.xerial:sqlite-jdbc:3.47.2.0'
    
    // Configuration
    implementation 'com.electronwill.night-config:toml:3.6.6'
    implementation 'com.electronwill.night-config:json:3.6.6'
    
    // ===== TESTING DEPENDENCIES =====
    // Testing dependencies - only available in test scope, excluded from production builds
    
    // JUnit 5 (Jupiter) - Core testing framework
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
    
    // AssertJ - Fluent assertions library
    testImplementation 'org.assertj:assertj-core:3.25.1'
    
    // Mockito - Mocking framework
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.8.0'
    
    // JMH - Java Microbenchmark Harness for performance testing
    testImplementation 'org.openjdk.jmh:jmh-core:1.37'
    testAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
    
    // Awaitility - Async testing utilities
    testImplementation 'org.awaitility:awaitility:4.2.0'
}

// ============================================================================
// SOURCE SETS CONFIGURATION
// ============================================================================
// SIMPLIFIED: All code (Fabric Loader + Minecraft + all mods) compiles together
// in a single source set into ONE JAR. No circular dependencies!
// ============================================================================

sourceSets {
    // Single main source set - Everything together!
    main {
        java {
            srcDir 'src/main/java'
            
            // Exclude bundled Mojang sources that shadow Maven dependencies
            exclude 'com/mojang/authlib/**'
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
    
    test {
        java {
            srcDirs = ['src/test']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

// ============================================================================
// RUST NATIVE BUILD
// ============================================================================
// Rust source lives under src/main/rust, but all generated Cargo output is forced
// into build/rust so native artifacts never appear under src/.
// ============================================================================

def rustSourceDir = file('src/main/rust')
def rustManifest = file('src/main/rust/Cargo.toml')
def rustTargetDir = layout.buildDirectory.dir('rust/target')
def rustBuiltNativesDir = layout.buildDirectory.dir('rust/native')
def rustCargoLibraryName = System.mapLibraryName('mattmc_rust')
def rustCargoProfile = (findProperty('mattmcRustProfile') ?: 'dev').toString()
def rustCargoProfileDir = rustCargoProfile == 'dev' ? 'debug' : rustCargoProfile
def rustCargoBuildCommand = ['cargo', 'build', '--manifest-path', rustManifest.absolutePath, '--locked']
if (rustCargoProfile != 'dev') {
    rustCargoBuildCommand += ['--profile', rustCargoProfile]
}
def resolveRustNativePlatformKey = {
    def osName = System.getProperty('os.name').toLowerCase()
    def osPart
    if (osName.contains('windows') || osName.contains('win')) {
        osPart = 'win'
    } else if (osName.contains('mac') || osName.contains('darwin')) {
        osPart = 'mac'
    } else if (osName.contains('linux')) {
        osPart = 'linux'
    } else {
        throw new GradleException("Unsupported OS for Rust native library: ${System.getProperty('os.name')}")
    }

    def archName = System.getProperty('os.arch').toLowerCase()
    def archPart
    if (archName in ['x86_64', 'amd64']) {
        archPart = 'x64'
    } else if (archName in ['aarch64', 'arm64']) {
        archPart = 'aarch64'
    } else {
        throw new GradleException("Unsupported architecture for Rust native library: ${System.getProperty('os.arch')}")
    }

    return "${osPart}-${archPart}"
}
def rustNativePlatformKey = resolveRustNativePlatformKey()
def rustNativeExtension = System.getProperty('os.name').toLowerCase().contains('win')
    ? 'dll'
    : (System.getProperty('os.name').toLowerCase().with { it.contains('mac') || it.contains('darwin') } ? 'dylib' : 'so')
def rustNativeFileName = "mattmc_rust-${rustNativePlatformKey}.${rustNativeExtension}"
def rustNativeJvmArgs = [
    '--enable-native-access=ALL-UNNAMED',
    "-Dmattmc.rust.natives.dir=${rustBuiltNativesDir.get().asFile.absolutePath}"
]
def rustSourceFiles = fileTree(rustSourceDir) {
    include '**/*.rs'
    include 'Cargo.toml'
    include 'Cargo.lock'
    exclude 'target/**'
}

tasks.register('buildRustNative', Exec) {
    group = 'build'
    description = 'Builds the mandatory Rust native library used by Java code.'

    inputs.files(rustSourceFiles)
    inputs.property('mattmcRustProfile', rustCargoProfile)
    outputs.file(rustBuiltNativesDir.map { it.file(rustNativeFileName) })

    environment 'CARGO_TARGET_DIR', rustTargetDir.get().asFile.absolutePath
    commandLine rustCargoBuildCommand

    doLast {
        def cargoLibrary = rustTargetDir.get().file("${rustCargoProfileDir}/${rustCargoLibraryName}").asFile
        if (!cargoLibrary.isFile()) {
            throw new GradleException("Cargo did not produce expected Rust native library: ${cargoLibrary}")
        }

        copy {
            from cargoLibrary
            into rustBuiltNativesDir.get().asFile
            rename { rustNativeFileName }
        }
    }
}

tasks.register('testRustNative', Exec) {
    group = 'verification'
    description = 'Runs Rust unit tests for src/main/rust.'

    inputs.files(rustSourceFiles)

    environment 'CARGO_TARGET_DIR', rustTargetDir.get().asFile.absolutePath
    commandLine 'cargo', 'test', '--manifest-path', rustManifest.absolutePath, '--locked'
}

tasks.named('classes') {
    dependsOn 'buildRustNative'
}

tasks.withType(Test).configureEach {
    dependsOn 'buildRustNative', 'testRustNative'
    systemProperty 'mattmc.rust.natives.dir', rustBuiltNativesDir.get().asFile.absolutePath
    jvmArgs rustNativeJvmArgs
}

tasks.withType(JavaExec).configureEach {
    dependsOn 'buildRustNative'
    doFirst {
        jvmArgs rustNativeJvmArgs
    }
}

// ============================================================================
// RESOURCE PROCESSING
// ============================================================================
// Handle duplicate resources from consolidated mods
// ============================================================================

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ============================================================================
// DEPENDENCIES ARE NOW SIMPLE
// ============================================================================
// No separate configurations needed - everything uses main implementation
// ============================================================================

// ============================================================================
// JAR TASK - SINGLE JAR WITH EVERYTHING
// ============================================================================
// Create ONE JAR containing Fabric Loader + Minecraft + all mods
// ============================================================================

// ============================================================================
// SHADER PACK ZIP TASK
// ============================================================================
// Creates a zip of the shader pack from src/main/resources/shaders
// This is done at runtime so the shader source code can be edited
// ============================================================================

tasks.register('shaderPackZip', Zip) {
    group = 'build'
    description = 'Creates a zip of the ComplementaryHungLoIfied shader pack'
    
    // Always regenerate the zip to pick up any shader changes
    // I shouldnt need this though... if the shaders fail to pick up changes uncomment the line below
    //outputs.upToDateWhen { false }
    
    archiveBaseName = 'ComplementaryHungLoIfied'
    archiveVersion = ''
    archiveClassifier = ''
    
    from 'src/main/resources/shaders/ComplementaryHungLoIfied'
    
    destinationDirectory = file("${buildDir}/shaderpacks")
}

// ============================================================================
// JAR CONFIGURATION
// ============================================================================
// The main JAR is ONE SINGLE JAR with Fabric Loader + Minecraft + all mods
// ============================================================================

jar {
    // ONE JAR with EVERYTHING - Fabric Loader + Minecraft + all mods
    from sourceSets.main.output
    
    manifest {
        attributes(
            'Main-Class': 'net.fabricmc.loader.impl.launch.knot.KnotClient',
            'Implementation-Title': 'MattMC',
            'Implementation-Version': version
        )
    }
    
    // Exclude duplicate META-INF/services - merge them instead
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Server run configuration
application {
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
}

// Detect macOS platform for JVM argument adjustments
// Check for both "Mac OS X" and "macOS" (case-insensitive)
def isMacOS = System.getProperty('os.name').toLowerCase().with { it.startsWith('mac') || it.contains('darwin') }

// Common JVM arguments for server tasks
// Use G1GC on macOS due to ZGC stability issues (SIGBUS crashes in Arena::destruct_contents)
def serverJvmArgs = [
    '-Xmx2G',
    '-Xms1G'
]

if (isMacOS) {
    // Use G1GC on macOS - ZGC has known stability issues causing SIGBUS crashes
    serverJvmArgs += '-XX:+UseG1GC'
} else {
    // Use ZGC on Linux/Windows for better performance
    serverJvmArgs += '-XX:+UseZGC'
    serverJvmArgs += '-XX:+UseCompactObjectHeaders'
}

// Common JVM arguments for client tasks
// Use G1GC on macOS due to ZGC stability issues (SIGBUS crashes in Arena::destruct_contents)
def clientJvmArgs = [
    '-Xmx8G',
    '-Xms4G',
    '-Dorg.lwjgl.util.Debug=true'
]

if (isMacOS) {
    // Use G1GC on macOS - ZGC has known stability issues causing SIGBUS crashes
    clientJvmArgs += '-XX:+UseG1GC'
    // Additional macOS stability flags to prevent Arena/Chunk crashes
    clientJvmArgs += '-XX:ReservedCodeCacheSize=512m'
    clientJvmArgs += '-XX:+DisableExplicitGC'
    clientJvmArgs += '-XX:MaxMetaspaceSize=512m'
    clientJvmArgs += '-Djava.awt.headless=false'
    // Prevent chunk allocation crashes during shader loading
    clientJvmArgs += '-XX:+UnlockExperimentalVMOptions'
    clientJvmArgs += '-XX:G1NewSizePercent=20'
    clientJvmArgs += '-XX:G1MaxNewSizePercent=80'
    clientJvmArgs += '-XX:+UseStringDeduplication'
    clientJvmArgs += '-XX:MaxGCPauseMillis=200'
} else {
    // Use ZGC on Linux/Windows for better performance
    clientJvmArgs += '-XX:+UseZGC'
    clientJvmArgs += '-XX:+UseCompactObjectHeaders'
}

// Add macOS-specific JVM arguments for LWJGL/GLFW
if (isMacOS) {
    clientJvmArgs += '-XstartOnFirstThread'
}

def resolveCurrentPlatformKey() {
    def osName = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()

    def archKey = (arch.contains('aarch64') || arch.contains('arm64')) ? 'aarch64' : 'x64'

    if (osName.contains('windows') || osName.contains('win')) {
        return "win-${archKey}"
    }
    if (osName.contains('linux')) {
        return "linux-${archKey}"
    }
    if (osName.contains('mac')) {
        return "mac-${archKey}"
    }

    return null
}

def resolveBundledJdkExecutableForCurrentPlatform(File baseDir) {
    def platformKey = resolveCurrentPlatformKey()
    if (platformKey == null) {
        return null
    }

    def osName = System.getProperty('os.name').toLowerCase()
    def javaExecutableName = (osName.contains('windows') || osName.contains('win')) ? 'java.exe' : 'java'

    def platformPath = new File(baseDir, "run/jdk/${platformKey}/bin/${javaExecutableName}")
    if (platformPath.exists()) {
        return platformPath
    }

    return null
}

// Helper method to configure JavaExec tasks to use bundled JDK (if available) or toolchain
def configureBundledJdk(JavaExec task) {
    def bundledJavaExe = resolveBundledJdkExecutableForCurrentPlatform(project.projectDir)
    def platformKey = resolveCurrentPlatformKey()
    
    // Check if bundled JDK exists at configuration time
    if (bundledJavaExe != null && bundledJavaExe.exists()) {
        // Use bundled JDK if available
        task.executable = bundledJavaExe.absolutePath
        task.doFirst {
            println "Using bundled JDK from: ${bundledJavaExe.parentFile.parentFile.absolutePath}"
        }
    } else {
        // Use Gradle toolchain (will auto-download Java if needed via Foojay resolver)
        task.javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
        task.doFirst {
            println "Using Gradle toolchain for Java ${targetJavaVersion} (bundled JDK not found)"
            println "Toolchain will be auto-downloaded if not available locally"
            println ""
            if (platformKey != null) {
                println "💡 Expected bundled JDK at: run/jdk/${platformKey}/bin"
            }
            println "💡 To use bundled JDK instead, run: ./gradlew downloadJdk copyJdkToRun"
        }
    }
}

/**
 * Helper method to verify that a main class file exists before running a JavaExec task.
 * This helps detect build cache corruption issues early with a helpful error message.
 * 
 * @param classFileName The path to the class file (e.g., 'net/minecraft/server/Main.class')
 * @param errorContext A description for error messages (e.g., 'Server main class' or 'Client main class')
 */
def verifyMainClassExists(String classFileName, String errorContext) {
    def mainClassFile = sourceSets.main.output.classesDirs.files.collect { 
        new File(it, classFileName) 
    }.find { it.exists() }
    
    if (mainClassFile == null) {
        throw new GradleException(
            "\n" +
            "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n" +
            "ERROR: ${errorContext} file not found!\n" +
            "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n" +
            "\n" +
            "Expected: ${classFileName} in one of:\n" +
            sourceSets.main.output.classesDirs.files.collect { "  - ${it.absolutePath}" }.join("\n") + "\n" +
            "\n" +
            "This usually indicates a Gradle build cache issue.\n" +
            "\n" +
            "To fix this, please run:\n" +
            "  ./gradlew clean build --no-build-cache\n" +
            "\n" +
            "If the problem persists, try clearing your Gradle cache:\n" +
            "  rm -rf ~/.gradle/caches/\n" +
            "  ./gradlew clean build\n" +
            "\n" +
            "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"
        )
    }
}

