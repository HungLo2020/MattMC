tasks.register('runRealChunkMeshingReplay', JavaExec) {
    group = 'verification'
    description = 'Runs the real production chunk meshing replay runner inside the Minecraft client.'

    dependsOn 'jar', 'copyJdkToRun', 'shaderPackZip'

    classpath = files(jar.archiveFile.get().asFile) + configurations.runtimeClasspath
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'

    def replayRunDirProvider = providers.gradleProperty('mattmcReplayRunDir')
            .orElse("${buildDir}/real-chunk-meshing-replay/run")
    def replayRunDir = file(replayRunDirProvider.get())
    def replayOutput = providers.gradleProperty('mattmcReplayOutput')
            .orElse("${buildDir}/real-chunk-meshing-replay/result.json")
    def replayWarmup = providers.gradleProperty('mattmcReplayWarmup').orElse('30')
    def replayWarmupSeconds = providers.gradleProperty('mattmcReplayWarmupSeconds').orElse('0')
    def replayMeasure = providers.gradleProperty('mattmcReplayMeasure').orElse('80')
    def replayMeasureSeconds = providers.gradleProperty('mattmcReplayMeasureSeconds').orElse('0')
    def replayRebuildsPerSample = providers.gradleProperty('mattmcReplayRebuildsPerSample').orElse('1')
    def replayValidateEachSample = providers.gradleProperty('mattmcReplayValidateEachSample').orElse('1')
    def replayRustProfile = providers.gradleProperty('mattmcReplayRustProfile').orElse(rustCargoProfile)
    def replayFixture = providers.gradleProperty('mattmcReplayFixture').orElse('')

    workingDir = replayRunDir
    jvmArgs = clientJvmArgs + [
        '-Dfabric.development=true',
        '-Dmattmc.realMeshingReplay=true',
        "-Dmattmc.realMeshingReplay.output=${replayOutput.get()}",
        "-Dmattmc.realMeshingReplay.warmup=${replayWarmup.get()}",
        "-Dmattmc.realMeshingReplay.warmupSeconds=${replayWarmupSeconds.get()}",
        "-Dmattmc.realMeshingReplay.measure=${replayMeasure.get()}",
        "-Dmattmc.realMeshingReplay.measureSeconds=${replayMeasureSeconds.get()}",
        "-Dmattmc.realMeshingReplay.rebuildsPerSample=${replayRebuildsPerSample.get()}",
        "-Dmattmc.realMeshingReplay.validateEachSample=${replayValidateEachSample.get()}",
        "-Dmattmc.realMeshingReplay.rustProfile=${replayRustProfile.get()}",
        "-Dmattmc.realMeshingReplay.fixture=${replayFixture.get()}"
    ]

    args = [
        '--version', '1.21.10',
        '--accessToken', '0',
        '--gameDir', replayRunDir.absolutePath
    ]

    doFirst {
        delete replayRunDir
        replayRunDir.mkdirs()
        file("${replayRunDir}/resourcepacks").mkdirs()
        def shaderpacksDir = file("${replayRunDir}/shaderpacks")
        shaderpacksDir.mkdirs()
        copy {
            from file("${buildDir}/shaderpacks")
            into shaderpacksDir
            include '*.zip'
        }
    }

    configureBundledJdk(it)
}

// Task to download bundled JDK if not present
tasks.register('downloadJdk', Exec) {
    group = 'minecraft'
    description = "Downloads Temurin OpenJDK ${targetJavaVersion} if not already present"
    
    def platformKey = resolveCurrentPlatformKey()
    def jdkDir = platformKey != null ? file("libraries/jdk/${platformKey}") : null
    def osName = System.getProperty('os.name').toLowerCase()
    def isWindows = osName.contains('windows') || osName.contains('win')
    def isLinux = osName.contains('linux')
    def isMac = osName.contains('mac')
    
    // Determine the Java executable path based on OS
    def javaExe = (jdkDir == null) ? null : (isWindows ? new File(jdkDir, 'bin/java.exe') : new File(jdkDir, 'bin/java'))
    
    // Only run if JDK doesn't exist
    onlyIf { 
        platformKey != null && (javaExe == null || !javaExe.exists())
    }
    
    workingDir = file('.')
    
    // Use platform-specific download script
    if (isWindows) {
        commandLine 'powershell', '-ExecutionPolicy', 'RemoteSigned', '-File', 'libraries/download-jdk.ps1'
    } else if (isLinux) {
        commandLine 'bash', 'libraries/download-jdk.sh'
    } else if (isMac) {
        commandLine 'bash', 'libraries/download-jdk.sh'
    }
    
    doFirst {
        if (platformKey != null) {
            println "📂 Target bundled JDK path: libraries/jdk/${platformKey}"
        }
        if (isWindows) {
            println "📥 Downloading JDK for Windows..."
        } else if (isLinux) {
            println "📥 Downloading JDK for Linux..."
        } else if (isMac) {
            println "📥 Downloading JDK for macOS..."
        } else {
            println "⚠️  Unsupported OS: ${osName}"
            println "   Please download JDK manually from: https://adoptium.net/temurin/releases/"
            println "   See libraries/JDK-README.md for instructions"
        }
    }
}

// Task to copy JDK to run directory
tasks.register('copyJdkToRun') {
    group = 'minecraft'
    description = 'Copies bundled JDK to run directory'
    
    dependsOn 'downloadJdk'
    
    def platformKey = resolveCurrentPlatformKey()
    def platformSrcJdkDir = platformKey != null ? file("libraries/jdk/${platformKey}") : null
    def destJdkDir = platformKey != null ? file("run/jdk/${platformKey}") : null
    def osName = System.getProperty('os.name').toLowerCase()
    def isWindows = osName.contains('windows') || osName.contains('win')
    
    // Determine the Java executable path based on OS
    def platformJavaExe = platformSrcJdkDir == null ? null : (isWindows ? 
        new File(platformSrcJdkDir, 'bin/java.exe') : 
        new File(platformSrcJdkDir, 'bin/java'))
    
    // Declare inputs only - not outputs to avoid Gradle detecting
    // implicit dependencies with compileJava task
    if (platformSrcJdkDir != null && platformSrcJdkDir.exists()) {
        inputs.dir(platformSrcJdkDir).skipWhenEmpty()
    }
    
    // Only run if source JDK exists
    onlyIf { platformSrcJdkDir != null && platformJavaExe != null && platformSrcJdkDir.exists() && platformJavaExe.exists() }
    
    doLast {
        if (platformKey == null) {
            println "⚠️  Unsupported platform for bundled JDK copy."
            return
        }

        if (platformSrcJdkDir == null || !platformSrcJdkDir.exists()) {
            println "⚠️  JDK not found at libraries/jdk/${platformKey}."
            println "   Run: ./gradlew downloadJdk"
            println "   Or see libraries/JDK-README.md for manual setup"
            return
        }
        
        // Delete existing JDK directory to avoid permission issues with existing files
        if (destJdkDir.exists()) {
            delete destJdkDir
        }
        
        println "📂 Copying JDK to run directory..."
        copy {
            from platformSrcJdkDir
            into destJdkDir
        }
        println "✅ JDK copied to ${destJdkDir}"
    }
}



