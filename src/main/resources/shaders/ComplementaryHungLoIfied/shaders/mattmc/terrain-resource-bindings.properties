# Semantic terrain-source resources for the selected Overworld terrain pair.
# These are pack declarations, not native bindings. Rust resolves each role
# into owned resources only when the full selected-source route is available.
tex=material_atlas
colortex0=shader_pack_color:primary
colortex1=shader_pack_color:previous_depth
colortex2=shader_pack_color:temporal_aa
colortex3=shader_pack_color:translucent_final
colortex4=shader_pack_color:volumetric_factor
colortex5=shader_pack_color:normal_scene
colortex6=shader_pack_color:material_auxiliary
colortex7=shader_pack_color:temporal_reflection
# Complementary's DH water source uses the legacy gaux aliases for the same
# pack-owned named histories. These remain source-level semantic aliases;
# Rust resolves the named color resources without retaining attachment slots.
gaux1=shader_pack_color:volumetric_factor
gaux2=shader_pack_color:normal_scene
depthtex0=main_depth
depthtex1=main_depth_before_translucency
depthtex2=main_depth_previous
normals=material_normal_map
specular=material_specular_map
noisetex=noise
shadowcolor0=shadow_color
shadowcolor1=shadow_color_secondary
shadowtex0=shadow_depth_primary
shadowtex1=shadow_depth_secondary
dhDepthTex=distant_horizons_opaque_depth
dhDepthTex1=distant_horizons_depth_before_translucency
floodfill_sampler=colored_voxel_light_current
floodfill_sampler_copy=colored_voxel_light_previous
# Complementary samples the occupancy volume while propagating and shading
# colored voxel light. This aliases the same Rust-owned semantic volume as
# the source storage declaration below; the role is never a texture unit.
voxel_sampler=colored_voxel_occupancy
voxel_img=colored_voxel_occupancy
# Rain-puddle rejection/occupancy is a Rust-owned unsigned 2D source image.
# The selected source route remains unadmitted until the shadow writer and
# sampled view are both generation-coherent; these names are not GL bindings.
puddle_sampler=puddle_occupancy
puddle_img=puddle_occupancy
gaux4=pack_texture:lib/textures/cloud-water.png
