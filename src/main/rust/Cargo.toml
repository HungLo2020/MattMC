[package]
name = "mattmc_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "mattmc_native"
path = "lib.rs"  # Specify lib.rs is in root of rust directory, not src/lib.rs
crate-type = ["cdylib"]  # Creates a dynamic library for Java FFM

[dependencies]
# No external dependencies needed for MathUtil

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
