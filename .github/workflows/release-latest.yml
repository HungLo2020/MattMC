name: Build And Publish Latest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Export And Replace Latest Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build client distribution zip
        run: ./gradlew clean clientDistZip --no-daemon

      - name: Locate built distribution zip
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find build/distributions -maxdepth 1 -type f -name 'MattMC-Client-*.zip' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No MattMC client distribution zip found in build/distributions"
            exit 1
          fi

          if ! unzip -Z1 "$ZIP_FILE" | head -n 4000 | grep -qE '(^|/)run-mattmc\.sh$|(^|/)run-mattmc\.bat$'; then
            echo "ERROR: Selected archive does not look like the exported client distribution"
            exit 1
          fi

          if unzip -Z1 "$ZIP_FILE" | head -n 4000 | grep -qE '(^|/)src/main/java/|(^|/)build\.gradle$|(^|/)settings\.gradle$|(^|/)gradlew$'; then
            echo "ERROR: Selected archive appears to be a source/project archive"
            exit 1
          fi

          ZIP_BASENAME="$(basename "$ZIP_FILE")"
          VERSION="${ZIP_BASENAME#MattMC-Client-}"
          VERSION="${VERSION%.zip}"

          if [ -z "$VERSION" ] || [ "$VERSION" = "$ZIP_BASENAME" ]; then
            echo "ERROR: Could not parse version from zip name: $ZIP_BASENAME"
            exit 1
          fi

          LINUX_ZIP_FILE="build/distributions/MattMC-Client-${VERSION}-linux-x64.zip"
          cp -f "$ZIP_FILE" "$LINUX_ZIP_FILE"

          echo "zip_file=$LINUX_ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$LINUX_ZIP_FILE")" >> "$GITHUB_OUTPUT"

      - name: Delete previous latest release if it exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi

      - name: Create latest release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest "${{ steps.locate_zip.outputs.zip_file }}" \
            --title "latest" \
            --notes "Automated build upload from GitHub Actions.\n\nAsset: ${{ steps.locate_zip.outputs.zip_name }}" \
            --latest
