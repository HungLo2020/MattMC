name: Release Latest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    name: Build Linux x64 Release
    uses: ./.github/workflows/build-linux-x64-release.yml

  build-windows-x64:
    name: Build Windows x64 Release
    uses: ./.github/workflows/build-windows-x64-release.yml

  publish-latest:
    name: Replace Latest Release With Platform Assets
    runs-on: ubuntu-latest
    needs:
      - build-linux-x64
      - build-windows-x64

    steps:
      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-release
          path: release-assets

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: release-assets

      - name: Verify release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ASSETS < <(find release-assets -maxdepth 1 -type f -name 'MattMC-Client-*-x64.zip' | sort)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "ERROR: No release assets found in release-assets"
            exit 1
          fi

          printf '%s\n' "${ASSETS[@]}"
          echo "asset_list=${ASSETS[*]}" >> "$GITHUB_OUTPUT"

      - name: Delete previous latest release if it exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi

      - name: Create latest release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_ASSET: ${{ needs.build-linux-x64.outputs.asset_name }}
          WINDOWS_ASSET: ${{ needs.build-windows-x64.outputs.asset_name }}
        run: |
          gh release create latest release-assets/*.zip \
            --title "latest" \
            --notes "Automated build upload from GitHub Actions.\n\nAssets:\n- ${LINUX_ASSET}\n- ${WINDOWS_ASSET}" \
            --latest
