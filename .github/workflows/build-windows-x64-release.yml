name: Build Windows x64 Release

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      asset_name:
        description: Windows x64 release asset filename
        value: ${{ jobs.build.outputs.asset_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 Distribution
    runs-on: windows-latest
    outputs:
      asset_name: ${{ steps.metadata.outputs.asset_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify native shader compiler build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            throw 'CMake is required to build Shaderc into mattmc_rust.'
          }
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            throw 'Python is required to build Shaderc into mattmc_rust.'
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

          cmake --version
          python --version
          ninja --version

      - name: Set up Rust stable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            throw 'rustup is required to install the Rust toolchain.'
          }

          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Build client distribution zip
        shell: pwsh
        run: .\gradlew.bat clean clientDistZip -PmattmcRustProfile=release --no-daemon

      - name: Locate and label Windows x64 zip
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $zipFile = Get-ChildItem -Path 'build/distributions' -Filter 'MattMC-Client-*.zip' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $zipFile) {
            throw 'No MattMC client distribution zip found in build/distributions'
          }

          $version = [regex]::Match($zipFile.Name, '^MattMC-Client-(.+)\.zip$').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not parse version from zip name: $($zipFile.Name)"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipFile.FullName)
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }

            if (-not ($entries | Where-Object { $_ -match '(^|/)run-mattmc\.sh$|(^|/)run-mattmc\.bat$' })) {
              throw 'Selected archive does not look like the exported client distribution'
            }

            if ($entries | Where-Object { $_ -match '(^|/)src/main/java/|(^|/)build\.gradle$|(^|/)settings\.gradle$|(^|/)gradlew$' }) {
              throw 'Selected archive appears to be a source/project archive'
            }

            if (-not ($entries | Where-Object { $_ -match '(^|/)natives/mattmc_rust-win-x64\.dll$' })) {
              throw 'Selected archive is missing Windows x64 Rust native: natives/mattmc_rust-win-x64.dll'
            }
          }
          finally {
            $zip.Dispose()
          }

          $windowsZipFile = Join-Path 'build/distributions' "MattMC-Client-$version-windows-x64.zip"
          Copy-Item -Path $zipFile.FullName -Destination $windowsZipFile -Force

          "asset_file=$windowsZipFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset_name=$(Split-Path $windowsZipFile -Leaf)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: ${{ steps.metadata.outputs.asset_file }}
          if-no-files-found: error
