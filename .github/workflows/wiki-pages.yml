name: Wiki Pages

on:
  push:
    branches:
      - master
    paths:
      - README.md
      - AGENTS.md
      - docs/**
      - wiki/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/wiki-pages.yml
      - DevUtils/CheckDocs.py
      - DevUtils/RunWiki.py
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - docs/**
      - wiki/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/wiki-pages.yml
      - DevUtils/CheckDocs.py
      - DevUtils/RunWiki.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wiki-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install wiki dependencies
        run: pip install -r requirements-docs.txt

      - name: Check documentation indexes and links
        run: python DevUtils/CheckDocs.py

      - name: Build wiki
        run: mkdocs build --strict

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy wiki
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
