name: Temporary indexed-mesh alpha semantic patch

on:
  push:
    branches:
      - agent/rust-generic-quad-particles
    paths:
      - .github/workflows/temporary-indexed-mesh-alpha-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-generic-quad-particles
          fetch-depth: 0

      - name: Apply exact semantic patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected exactly one match, found {count}: {pattern[:120]!r}")
              p.write_text(updated)

          java = "src/main/java/net/vulkanic/world/RustGalWorldPrimitiveRenderer.java"
          rust = "src/main/rust/render/vulkanic/world_primitive_frontend.rs"
          registry = "src/main/rust/render/vulkanic/world_primitive_frontend/material_registry.rs"

          replace_once(java,
          "\tpublic static final int MATERIAL_ID_OPAQUE_TEXTURED = 0x6A2FD335;\n"
          "\tpublic static final int MATERIAL_ID_CUTOUT_TEXTURED = 0x129B1B90;\n"
          "\tpublic static final int MATERIAL_ID_TRANSLUCENT_TEXTURED = 0x4D21A7C3;\n",
          "\tpublic static final int MATERIAL_ID_OPAQUE_TEXTURED = 0x6A2FD335;\n"
          "\t/** Alpha-tested textured material matching ALPHA_CUTOUT=0.1. */\n"
          "\tpublic static final int MATERIAL_ID_CUTOUT_TEXTURED_0_1 = 0x259D874B;\n"
          "\t/** Alpha-tested textured material matching ALPHA_CUTOUT=0.5. */\n"
          "\tpublic static final int MATERIAL_ID_CUTOUT_TEXTURED = 0x129B1B90;\n"
          "\tpublic static final int MATERIAL_ID_TRANSLUCENT_TEXTURED = 0x4D21A7C3;\n"
          "\t/** Translucent textured material that still discards alpha below 0.1. */\n"
          "\tpublic static final int MATERIAL_ID_TRANSLUCENT_CUTOUT_TEXTURED_0_1 = 0x24D0895B;\n")

          replace_once(java,
          "\t\t\t\t\t\tSTRATUM_WORLD_MATERIAL, MATERIAL_ID_CUTOUT_TEXTURED, MATERIAL_TEXTURE_TERRAIN_BLOCK_ATLAS,\n",
          "\t\t\t\t\t\tSTRATUM_WORLD_MATERIAL, MATERIAL_ID_CUTOUT_TEXTURED_0_1, MATERIAL_TEXTURE_TERRAIN_BLOCK_ATLAS,\n")

          old_classifier = '''\tprivate static ModelMeshRenderSemantics modelMeshRenderSemantics(RenderType renderType) {
\t\tif (renderType == null) {
\t\t\treturn null;
\t\t}
\t\tvar blend = renderType.pipeline().getBlendFunction();
\t\tif (blend.isPresent()) {
\t\t\tif (!BlendFunction.TRANSLUCENT.equals(blend.get())) {
\t\t\t\treturn null;
\t\t\t}
\t\t\treturn new ModelMeshRenderSemantics(
\t\t\t\tMATERIAL_ID_TRANSLUCENT_TEXTURED,
\t\t\t\tMATERIAL_MODE_TRANSLUCENT,
\t\t\t\tDEPTH_POLICY_TEST_NO_WRITE,
\t\t\t\trenderType.pipeline().isCull() ? CULL_BACK : CULL_NONE
\t\t\t);
\t\t}
\t\treturn new ModelMeshRenderSemantics(
\t\t\tMATERIAL_ID_CUTOUT_TEXTURED,
\t\t\tMATERIAL_MODE_CUTOUT,
\t\t\tDEPTH_POLICY_TEST_WRITE,
\t\t\trenderType.pipeline().isCull() ? CULL_BACK : CULL_NONE
\t\t);
\t}
'''
          new_classifier = '''\tprivate static ModelMeshRenderSemantics modelMeshRenderSemantics(RenderType renderType) {
\t\tif (renderType == null) {
\t\t\treturn null;
\t\t}
\t\tvar pipeline = renderType.pipeline();
