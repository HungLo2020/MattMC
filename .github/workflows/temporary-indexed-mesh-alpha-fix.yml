\t\t\t|| pipeline.getDepthTestFunction() != net.blaze3d.platform.DepthTestFunction.LEQUAL_DEPTH_TEST) {
\t\t\treturn null;
\t\t}
\t\tvar blend = pipeline.getBlendFunction();
\t\tboolean translucent = blend.isPresent();
\t\tif (translucent && !BlendFunction.TRANSLUCENT.equals(blend.get())) {
\t\t\treturn null;
\t\t}
\t\tString alphaCutout = pipeline.getShaderDefines().values().get("ALPHA_CUTOUT");
\t\tint materialId;
