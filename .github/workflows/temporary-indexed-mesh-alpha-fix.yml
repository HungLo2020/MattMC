          # Source-level regression proof across the Java semantic boundary and Rust lowering.
          test = Path("src/test/java/net/vulkanic/world/IndexedMeshAlphaMaterialSemanticsTest.java")
          test.write_text('''package net.vulkanic.world;

import org.junit.jupiter.api.Test;

import java.nio.file.Files;
import java.nio.file.Path;

import static org.junit.jupiter.api.Assertions.assertFalse;
import static org.junit.jupiter.api.Assertions.assertTrue;

class IndexedMeshAlphaMaterialSemanticsTest {
    @Test
    void javaClassifierCarriesExactPipelineAlphaSemantics() throws Exception {
        String source = Files.readString(Path.of("src/main/java/net/vulkanic/world/RustGalWorldPrimitiveRenderer.java"));

        assertTrue(source.contains("getShaderDefines().values().get(\\\"ALPHA_CUTOUT\\\")"));
        assertTrue(source.contains("MATERIAL_ID_CUTOUT_TEXTURED_0_1 = 0x259D874B"));
        assertTrue(source.contains("MATERIAL_ID_TRANSLUCENT_CUTOUT_TEXTURED_0_1 = 0x24D0895B"));
        assertTrue(source.contains("alphaCutout == null"));
        assertTrue(source.contains("\\\"0.1\\\".equals(alphaCutout)"));
        assertTrue(source.contains("\\\"0.5\\\".equals(alphaCutout) && !translucent"));
        assertTrue(source.contains("pipeline.isWriteDepth() ? DEPTH_POLICY_TEST_WRITE : DEPTH_POLICY_TEST_NO_WRITE"));
        assertTrue(source.contains("pipeline.getDepthTestFunction() != net.blaze3d.platform.DepthTestFunction.LEQUAL_DEPTH_TEST"));
        assertTrue(source.contains("!pipeline.isWriteColor() || !pipeline.isWriteAlpha()"));
        assertFalse(source.contains("return new ModelMeshRenderSemantics(\\n\\t\\t\\tMATERIAL_ID_CUTOUT_TEXTURED,\\n\\t\\t\\tMATERIAL_MODE_CUTOUT,\\n\\t\\t\\tDEPTH_POLICY_TEST_WRITE"),
            "generic model admission must not collapse every non-blended pipeline to 0.5 cutout");
    }

