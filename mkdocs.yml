site_name: MattMC Wiki
site_description: Version-controlled MattMC wiki and project documentation
site_url: https://hunglo2020.github.io/MattMC/
repo_url: https://github.com/HungLo2020/MattMC
repo_name: HungLo2020/MattMC
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    scheme: slate
    primary: blue grey
    accent: light blue
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra_javascript:
  - assets/javascripts/random-page.js

nav:
  - Home: index.md
  - Gameplay: gameplay/Gameplay.md
  - Testing: testing/home.md
  - Development: development/DEV-TIPS-TOOLS.md
  - Changelog: changelog/CHANGELOG.md
  - Changes: changes/changes.md
