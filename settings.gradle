pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://repo.maven.apache.org/maven2' }
    }
}

// Enable automatic JDK provisioning for toolchains
// This allows Gradle to automatically download Java 21 when not found locally
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'MattMC'
